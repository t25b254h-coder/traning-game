<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひよこの学習部屋</title>
  <link rel="stylesheet" href="style.css">
    <script src="sound.js" defer></script>
    
  <!-- MathJaxの設定（$...$ を綺麗な数式に変換する） -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div id="quiz-container" style="height: auto; min-height: 1000px; padding-bottom: 2rem;">
    
    <!-- ホーム画面 -->
    <div id="home-container">
      <audio id="bgm" src="サンタは中央線でやってくる.mp3" autoplay loop></audio>
      <p id="clock" class="clock"></p>
      <h1>🐤ひよこの学習部屋🐤</h1>
      <img id="home-img" src="nebusoku_GIF.gif" width="1000" height="500" alt="ひよこの学習部屋">
      <p id="math-level" class="level1">数学レベル: 1</p>
      <p id="math-score" class="score1">数学スコア: 0</p>
      <p id="physics-level" class="level2">物理レベル: 1</p>
      <p id="physics-score" class="score2">物理スコア: 0</p>
      <p id="programming-level" class="level3">PGレベル: 1</p>
      <p id="programming-score" class="score3">PGスコア: 0</p>
      <p class="text1">どの分野の問題に挑戦しますか？</p>
      <div class="button-group">
        <button id="quiz1-btn" class="button1">数学問題</button>
        <button id="quiz2-btn" class="button2">物理問題</button>
        <button id="quiz3-btn" class="button3">プログラミング問題</button>
        <button id="reset-btn" class="buttonreset">データをリセット</button>
        <button id="muteBtn" class="mute" type="button">ミュート</button>
      </div>
    </div>

    <!-- スタート(数学)画面 -->
    <div id="start-container" style="display: none;">
      <h1>３択数学クイズ</h1>
      <p>ランダムな１０問のクイズに挑戦しよう！</p>
      <p>出題範囲：基礎数理A1 応用数理B・E 電気数理Ⅰ 離散数学</p>
      <img id="chick-img-math" src="GIF_studying.gif" width="500" height="300" alt="選択中のひよこ">
      <p class="chick-title">ひよこを選ぼう</p>
      <div id="chick-select-math" class="chick-select"></div>
      <button id="start-btn">スタート</button>
      <button id="back-btn" style="margin-top: 10px;">戻る</button>
    </div>

    <!-- スタート(物理)画面 -->
    <div id="start-container2" style="display: none;">
      <h1>３択物理クイズ</h1>
      <p>ランダムな１０問のクイズに挑戦しよう！</p>
      <p>出題範囲：力学 電磁気 光学 熱</p>
      <img id="chick-img-physics" src="GIF_studying.gif" width="500" height="300" alt="選択中のひよこ">
      <p class="chick-title">ひよこを選ぼう</p>
      <div id="chick-select-physics" class="chick-select"></div>
      <button id="start-btn2">スタート</button>
      <button id="back-btn2" style="margin-top: 10px;">戻る</button>
    </div>

    <!-- スタート(プログラミング)画面 -->
    <div id="start-container3" style="display: none;">
      <h1>３択プログラミングクイズ</h1>
      <p>ランダムな１０問のクイズに挑戦しよう！</p>
      <p>出題範囲：Python 基礎・応用</p>
      <img id="chick-img-pro" src="GIF_studying.gif" width="500" height="300" alt="選択中のひよこ">
      <p class="chick-title">ひよこを選ぼう</p>
      <div id="chick-select-pro" class="chick-select"></div>
      <button id="start-btn3">スタート</button>
      <button id="back-btn3" style="margin-top: 10px;">戻る</button>
    </div>

    <!-- クイズ画面（初期状態は非表示） -->
    <div id="quiz-header" style="display: none;">
      <p id="category-badge" style="font-size: 1.2rem; font-weight: bold; color: #304dec; margin-bottom: 10px;"></p>
      <img id="quiz-chick-img" src="GIF_studying.gif" alt="応援するひよこ" style="width: auto; max-width: 100%; height: 300px; margin-bottom: 15px; border-radius: 15px;">
      <h2 id="question" style="margin-bottom: 20px;">Question text</h2>
      <!-- JSでシャッフルされた3択ボタンがここに入ります -->
      <div id="quiz-options"></div>
    </div>

    <!-- 結果画面（初期状態は非表示） -->
    <div id="results-container" style="display: none;">
      <div id="results-header">
        <h2 id="results"></h2>
        <button id="next-quiz">次の問題へ</button>
      </div>

      <!-- 最終結果表示エリア（全問終了時に使用） -->
      <div id="final-results" style="display: none; padding: 2rem;">
        <h2 id="score-text"></h2>
        <div id="summary-list" style="max-height: 450px; overflow-y: auto; text-align: left; margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.85); border-radius: 15px;"></div>
        <button id="restart-btn">もう一度挑戦する</button>
        <button id="back-home-btn" style="margin-top: 10px;">ホームに戻る</button>
      </div>
    </div>

  </div>
</body>
</html>
